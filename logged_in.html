<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>ToolsManager</title>
  </head>
  <body>
    <header>
      <div class="sitename">ToolsManager</div>

      <nav class="menubar">
        <ul>
          <li class="menu">
            <a href="index.html">Home</a>
          </li>

          <li class="menu">
            <a>お問い合わせ</a>
          </li>

          <li class="menu">
            <button class="account-button" data-type="logout">
              ログアウト
            </button>
          </li>

          <li class="menu">
            <button class="account-button" data-type="account-page">
              アカウントページ
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <div id="main-contents">
      <div id="sidebar">
        <aside>
          <p>サイドバー</p>
          <ul class="sidebar">
            <li><a>FFmpeg Converter</a></li>
            <li><a>Git Setup Assistant</a></li>
          </ul>
        </aside>
      </div>

      <main>
        <section class="introduction">
          <h2>サイト概要</h2>
          <p>
            ToolsManagerはコマンド操作や複雑な設定が必要な作業を、Web上で直感的に行えるサイトです
          </p>
        </section>

        <section class="catalog">
          <section class="tools" id="ffmpeg">
            <h3 class="tool-title">FFmpeg Converter</h3>

            <p class="tool-explanation">
              動画・音声の変換などを気軽に行うことができます
            </p>
          </section>

          <section class="tools" id="gitAssist">
            <h3 class="tool-title">Git Setup Assistant</h3>

            <p class="tool-explanation">
              Git、GitHubのセットアップを1からお手伝いします
            </p>
          </section>
        </section>
      </main>
    </div>

    <footer>
      <section class="footer">
        <ul>
          <li><a>GitHub</a></li>
          <li>version</li>
          <li>Copyright</li>
        </ul>
      </section>
    </footer>
    <script src="script.js"></script>
